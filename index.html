<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rancho Tycoon</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (loaded directly in the browser) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (translates the React JSX code below so the browser understands it) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Custom Animations -->
    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        
        @keyframes popIn { 
            0% { opacity: 0; transform: translate(-50%, -20px) scale(0.9); } 
            70% { transform: translate(-50%, 5px) scale(1.05); }
            100% { opacity: 1; transform: translate(-50%, 0) scale(1); } 
        }
        .animate-pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes dart {
            0% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(25px, -15px) scale(1.1); }
            50% { transform: translate(-10px, -30px) scale(1); }
            75% { transform: translate(-25px, 15px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }
        .animate-dart { animation: dart 2s ease-in-out infinite alternate; }

        /* Prevent selecting text while clicking rapidly or dragging */
        .select-none { user-select: none; }
    </style>
</head>
<body class="bg-amber-50">
    
    <!-- This is where the game will load -->
    <div id="root"></div>

    <!-- Game Logic -->
    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        // --- GAME CONFIGURATION ---
        const CATTLE_PER_WORKER = 15;
        const SHIP_AWAY_TIME = 25; 
        const SHIP_PRESENT_TIME = 20; 
        const GROWTH_INTERVAL = 8; 
        const EVENT_CHANCE_INTERVAL = 10; 

        const TRADE_GOODS = [
          { id: 'cloth', name: 'Silk & Fine Lace', hides: 3, tallow: 1, prestige: 1, icon: '🎀' },
          { id: 'furniture', name: 'Mahogany Furniture', hides: 6, tallow: 2, prestige: 3, icon: '🪑' },
          { id: 'saddle', name: 'Silver Saddle', hides: 10, tallow: 5, prestige: 6, icon: '🐎' },
        ];

        function App() {
          // --- STATE ---
          const [cattle, setCattle] = useState(10);
          const [hides, setHides] = useState(0);
          const [tallow, setTallow] = useState(0);
          const [workers, setWorkers] = useState(2); 
          const [family, setFamily] = useState(2); 
          const [prestige, setPrestige] = useState(0);
          
          const [shipTimer, setShipTimer] = useState(5); 
          const [shipPresent, setShipPresent] = useState(false);
          const [growthTimer, setGrowthTimer] = useState(GROWTH_INTERVAL);
          const [eventTimer, setEventTimer] = useState(EVENT_CHANCE_INTERVAL);
          
          // Hide Toss State
          const [hideTossActive, setHideTossActive] = useState(false);
          const [hideTossScore, setHideTossScore] = useState(0);
          const [hideTossTimer, setHideTossTimer] = useState(0);

          // Rodeo State
          const [rodeoActive, setRodeoActive] = useState(false);
          const [rodeoScore, setRodeoScore] = useState(0);
          const [rodeoTimer, setRodeoTimer] = useState(0);
          const [rodeoTargets, setRodeoTargets] = useState([]);

          // Random Opportunity States
          const [fandangoAvailable, setFandangoAvailable] = useState(false);
          const [rodeoAvailable, setRodeoAvailable] = useState(false);

          // Splash Screen and Popups
          const [gameStarted, setGameStarted] = useState(false);
          const [eventPopup, setEventPopup] = useState(null);

          const [logs, setLogs] = useState([
            { id: 0, text: "Welcome to your new Rancho! Manage your herd and trade with Boston ships.", type: "info" }
          ]);
          const logIdRef = useRef(1);

          // --- HELPER FUNCTIONS ---
          const addLog = useCallback((text, type = "info") => {
            setLogs(prev => {
              const newLogs = [{ id: logIdRef.current++, text, type }, ...prev];
              return newLogs.slice(0, 5); 
            });
          }, []);

          const triggerPopup = useCallback((text, icon, bgColor) => {
            setEventPopup({ text, icon, bgColor });
            setTimeout(() => setEventPopup(null), 4000); 
          }, []);

          // --- GAME LOOP ---
          useEffect(() => {
            if (hideTossActive || rodeoActive || !gameStarted) return;

            const timer = setInterval(() => {
              // 1. Ship Timers
              setShipTimer(prev => {
                if (prev <= 1) {
                  setShipPresent(currentlyPresent => {
                    if (currentlyPresent) {
                      addLog("The merchant ship has sailed away.", "bad");
                      return false;
                    } else {
                      addLog("A ship from Boston has dropped anchor!", "good");
                      return true;
                    }
                  });
                  return shipPresent ? SHIP_AWAY_TIME : SHIP_PRESENT_TIME;
                }
                return prev - 1;
              });

              // 2. Cattle Growth & Family Growth
              setGrowthTimer(prev => {
                if (prev <= 1) {
                  setCattle(currentCattle => {
                    const maxCattle = workers * CATTLE_PER_WORKER;
                    if (currentCattle < maxCattle) {
                      let newCalves = Math.floor(currentCattle * 0.08);
                      if (newCalves === 0 && Math.random() > 0.4) newCalves = 1;
                      const newTotal = Math.min(maxCattle, currentCattle + newCalves);
                      return newTotal;
                    } else if (Math.random() > 0.8) {
                       addLog("Herd at max size! Hire more workers.", "warn");
                    }
                    return currentCattle;
                  });

                  if (Math.random() > 0.85) {
                    setFamily(f => {
                      addLog("A cousin has moved to your Rancho! Family grew.", "good");
                      return f + 1;
                    });
                  }
                  return GROWTH_INTERVAL; 
                }
                return prev - 1;
              });

              // 3. Random Historical Events
              setEventTimer(prev => {
                if (prev <= 1) {
                  const roll = Math.random();
                  if (roll < 0.15) { 
                    setCattle(c => Math.max(2, c - 3)); 
                    addLog("Adversity! A Grizzly Bear attacked the herd! Lost 3 cattle.", "bad");
                    triggerPopup("Grizzly Bear Attack! -3 Cattle", "🐻", "bg-red-600");
                  } else if (roll < 0.25) {
                    setGrowthTimer(20); 
                    addLog("Adversity! A severe drought has hit. Grass is scarce.", "bad");
                    triggerPopup("Severe Drought! Growth stalled.", "☀️", "bg-yellow-500");
                  } else if (roll < 0.35 && !shipPresent) {
                     setShipTimer(2);
                     addLog("Favorable winds! A ship is arriving early!", "good");
                     triggerPopup("Favorable Winds! Ship arriving early!", "💨", "bg-blue-500");
                  } else if (roll < 0.50 && !fandangoAvailable) {
                     setFandangoAvailable(true);
                     addLog("Special Occasion! Your family is preparing a Fandango.", "info");
                     triggerPopup("Fandango Time! Check your Rancho.", "🎸", "bg-rose-500");
                  } else if (roll < 0.65 && !rodeoAvailable) {
                     setRodeoAvailable(true);
                     addLog("It's time for the Rodeo! Gather the unbranded cattle.", "info");
                     triggerPopup("Rodeo Time! Check your Rancho.", "🐎", "bg-orange-600");
                  }
                  return EVENT_CHANCE_INTERVAL;
                }
                return prev - 1;
              });

            }, 1000); 

            return () => clearInterval(timer);
          }, [shipPresent, workers, hideTossActive, rodeoActive, gameStarted, fandangoAvailable, rodeoAvailable, addLog, triggerPopup]);

          // --- MINI-GAME LOGIC ---
          useEffect(() => {
            let interval;
            if (hideTossActive && hideTossTimer > 0) {
              interval = setInterval(() => setHideTossTimer(t => t - 1), 1000);
            } else if (hideTossActive && hideTossTimer === 0) {
              setHides(h => h + hideTossScore);
              addLog(`Cliff Toss complete! You successfully loaded ${hideTossScore} hides.`, "good");
              setHideTossActive(false);
            }
            return () => clearInterval(interval);
          }, [hideTossActive, hideTossTimer, hideTossScore, addLog]);

          const startHideToss = () => {
            setHideTossScore(0);
            setHideTossTimer(10);
            setHideTossActive(true);
          };

          // --- RODEO LOGIC ---
          const generateTargets = (num) => {
            return Array.from({length: num}, () => ({
                id: Math.random().toString(),
                icon: Math.random() > 0.3 ? '🐄' : '🐎',
                top: `${10 + Math.random() * 75}%`,
                left: `${10 + Math.random() * 75}%`,
                animationDelay: `${Math.random()}s`
            }));
          };

          const startRodeo = () => {
            setRodeoScore(0);
            setRodeoTimer(10);
            setRodeoTargets(generateTargets(8));
            setRodeoActive(true);
            setRodeoAvailable(false);
          };

          const catchAnimal = (id) => {
            setRodeoScore(s => s + 1);
            setRodeoTargets(targets => targets.filter(t => t.id !== id));
          };

          // Rodeo Countdown
          useEffect(() => {
            if (rodeoActive && rodeoTimer > 0) {
                const timer = setTimeout(() => setRodeoTimer(t => t - 1), 1000);
                return () => clearTimeout(timer);
            }
          }, [rodeoActive, rodeoTimer]);

          // Rodeo Replenish & End Game
          useEffect(() => {
            if (rodeoActive && rodeoTargets.length < 4 && rodeoTimer > 0) {
                setRodeoTargets(prev => [...prev, ...generateTargets(5)]);
            }

            if (rodeoActive && rodeoTimer === 0) {
                setRodeoActive(false);
                setRodeoScore(finalScore => {
                    const cattleGained = Math.floor(finalScore / 3);
                    const prestigeGained = finalScore >= 5 ? 1 : 0;
                    
                    setCattle(c => Math.min(workers * CATTLE_PER_WORKER, c + cattleGained));
                    if (prestigeGained > 0) setPrestige(p => p + prestigeGained);
                    
                    addLog(`Rodeo complete! Caught ${finalScore} animals. Gained ${cattleGained} Cattle${prestigeGained > 0 ? ' and 1 Prestige' : ''}.`, "good");
                    return finalScore; 
                });
            }
          }, [rodeoActive, rodeoTimer, rodeoTargets.length, workers, addLog]);

          // Rodeo Expiration Timer
          useEffect(() => {
            let timeout;
            if (rodeoAvailable) {
              timeout = setTimeout(() => {
                setRodeoAvailable(false);
                addLog("You missed the Rodeo! The strays wandered off.", "warn");
              }, 10000); // 10 seconds to click the button
            }
            return () => clearTimeout(timeout); // Cleans up the timer if they click it in time
          }, [rodeoAvailable, addLog]);

          // --- PLAYER ACTIONS ---
          const processCattle = () => {
            if (cattle > 2) {
              const familyBonus = (family >= 5 && Math.random() > 0.5) ? 1 : 0;
              setCattle(prev => prev - 1);
              setHides(prev => prev + 1);
              setTallow(prev => prev + 1 + familyBonus);
              if (familyBonus > 0) addLog("Processed 1 cow. Family helped render extra tallow!", "info");
            }
          };

          const buyGood = (item) => {
            if (hides >= item.hides && tallow >= item.tallow) {
              setHides(h => h - item.hides);
              setTallow(t => t - item.tallow);
              setPrestige(p => p + item.prestige);
              addLog(`Traded for ${item.name}! (+${item.prestige} Prestige)`, "good");
            }
          };

          const hireWorker = () => {
            if (tallow >= 3 && hides >= 1) {
              setTallow(t => t - 3);
              setHides(h => h - 1);
              setWorkers(w => w + 1);
              addLog("Hired a Native Californian worker. Herd capacity increased!", "good");
            }
          };

          const hostFandango = () => {
            if (cattle >= 5) {
              setCattle(c => c - 2); 
              setPrestige(p => p + 3);
              addLog(`Hosted a grand Fandango for your ${family} family members! (+3 Prestige)`, "good");
              setFandangoAvailable(false);
            }
          };

          // --- RENDER ---
          return (
            <div className="min-h-screen font-sans p-2 sm:p-4 text-gray-800 select-none">
              <div className="max-w-6xl mx-auto">
                
                {/* Header */}
                <header className="text-center mb-4">
                  <h1 className="text-3xl font-black text-amber-900 drop-shadow-sm">Rancho Tycoon</h1>
                </header>

                {/* Resource Bar */}
                <div className="grid grid-cols-3 md:grid-cols-6 gap-2 mb-4 bg-white p-2 rounded-xl shadow-sm border border-amber-200 text-center">
                  <div className="p-1"><div className="text-2xl">🐄</div><div className="font-bold text-xs">CATTLE</div><div className="font-bold text-amber-900">{cattle} <span className="text-gray-400 font-normal text-xs">/ {workers * CATTLE_PER_WORKER}</span></div></div>
                  <div className="p-1"><div className="text-2xl">🟫</div><div className="font-bold text-xs">HIDES</div><div className="font-bold text-amber-900">{hides}</div></div>
                  <div className="p-1"><div className="text-2xl">🕯️</div><div className="font-bold text-xs">TALLOW</div><div className="font-bold text-amber-900">{tallow}</div></div>
                  <div className="p-1 bg-amber-100 rounded"><div className="text-2xl">🪶</div><div className="font-bold text-[10px] text-amber-800 leading-tight mt-1">NATIVE WORKERS<br/>(VAQUEROS)</div><div className="font-bold text-amber-900">{workers}</div></div>
                  <div className="p-1 bg-orange-100 rounded"><div className="text-2xl">👨‍👩‍👧‍👦</div><div className="font-bold text-xs text-orange-800">FAMILY</div><div className="font-bold text-amber-900">{family}</div></div>
                  <div className="p-1 bg-yellow-100 rounded border-2 border-yellow-300"><div className="text-2xl">🏆</div><div className="font-bold text-xs text-yellow-800">PRESTIGE</div><div className="font-bold text-amber-900">{prestige}</div></div>
                </div>

                {/* Main 3-Column Grid */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                  
                  {/* Column 1: The Land & Labor */}
                  <div className="bg-orange-50 rounded-xl p-4 border border-orange-200 flex flex-col gap-3">
                    <h2 className="text-lg font-bold text-orange-900 border-b border-orange-200 pb-1">🏡 Rancho & Family</h2>
                    <p className="text-xs text-orange-800">Native Californians (Vaqueros) provide the vital labor. Your extended family manages the estate.</p>
                    
                    <button onClick={processCattle} disabled={cattle <= 2} className="bg-amber-500 hover:bg-amber-600 disabled:bg-gray-300 disabled:text-gray-500 text-white p-3 rounded-lg font-bold text-sm shadow flex justify-between items-center transition-transform active:scale-95">
                      <span>🔪 Process 1 Cow</span>
                      <span className="text-xs font-normal opacity-80">+1 Hide, +1 Tallow</span>
                    </button>

                    <button onClick={hireWorker} disabled={tallow < 3 || hides < 1} className="bg-orange-600 hover:bg-orange-700 disabled:bg-gray-300 disabled:text-gray-500 text-white p-3 rounded-lg font-bold text-sm shadow flex justify-between items-center transition-transform active:scale-95 mt-auto">
                      <span>🪶 Hire Vaquero</span>
                      <span className="text-xs font-normal opacity-80">-1 Hide, -3 Tallow</span>
                    </button>

                    {fandangoAvailable && (
                      <button onClick={hostFandango} disabled={cattle < 5} className="bg-rose-500 hover:bg-rose-600 disabled:bg-gray-300 disabled:text-gray-500 text-white p-3 rounded-lg font-bold text-sm shadow flex justify-between items-center transition-transform active:scale-95 animate-fade-in border-2 border-rose-300">
                        <span>🎸 Host Fandango</span>
                        <span className="text-xs font-normal opacity-80">-2 Cattle (+3 Prestige)</span>
                      </button>
                    )}

                    {rodeoAvailable && (
                      <button onClick={startRodeo} className="bg-orange-600 hover:bg-orange-700 text-white p-3 rounded-lg font-bold text-sm shadow flex justify-between items-center transition-transform active:scale-95 animate-fade-in border-2 border-orange-300">
                        <span>🐎 Start Rodeo!</span>
                        <span className="text-xs font-normal opacity-80">Catch stray cattle!</span>
                      </button>
                    )}
                  </div>

                  {/* Column 2: The Coast / Trade */}
                  <div className="bg-blue-50 rounded-xl p-4 border border-blue-200 flex flex-col gap-3 relative">
                    <h2 className="text-lg font-bold text-blue-900 border-b border-blue-200 pb-1 flex justify-between">
                      <span>⚓ The Coast</span>
                      <span className="text-sm font-mono bg-white px-2 rounded border border-blue-200">
                        {shipPresent ? `Leaves in ${shipTimer}s` : `Arrives in ${shipTimer}s`}
                      </span>
                    </h2>

                    {shipPresent ? (
                      <div className="flex flex-col gap-2 animate-fade-in h-full">
                        <div className="bg-blue-600 text-white text-center py-1 rounded font-bold text-sm animate-pulse shadow-md">
                          🚢 Boston Ship Docked!
                        </div>
                        
                        <div className="flex-1 overflow-y-auto pr-1 space-y-2">
                          {TRADE_GOODS.map(item => (
                            <button key={item.id} onClick={() => buyGood(item)} disabled={hides < item.hides || tallow < item.tallow}
                              className="w-full bg-white border border-blue-300 hover:bg-blue-100 disabled:bg-gray-100 disabled:border-gray-200 disabled:text-gray-400 p-2 rounded flex justify-between items-center transition-transform active:scale-95 shadow-sm">
                              <div className="flex items-center gap-2">
                                <span className="text-xl">{item.icon}</span>
                                <div className="text-left">
                                  <div className="font-bold text-sm">{item.name}</div>
                                  <div className="text-xs text-blue-800">+{item.prestige} Prestige</div>
                                </div>
                              </div>
                              <div className="text-xs text-right font-medium">
                                <div>{item.hides} Hides</div>
                                <div>{item.tallow} Tallow</div>
                              </div>
                            </button>
                          ))}
                        </div>

                        <button onClick={startHideToss} className="bg-cyan-500 hover:bg-cyan-600 text-white p-2 rounded-lg font-bold text-sm shadow flex justify-center items-center gap-2 mt-2 border-b-4 border-cyan-700 active:border-b-0 active:translate-y-1 transition-all">
                          🌊 Play: Dana Point Hide Toss!
                        </button>
                      </div>
                    ) : (
                      <div className="flex-1 flex flex-col items-center justify-center text-blue-300 opacity-70">
                        <div className="text-5xl mb-2">🌊</div>
                        <p className="text-sm text-center px-4 font-medium text-blue-500">Waiting for merchant ships from around Cape Horn...</p>
                      </div>
                    )}
                  </div>

                  {/* Column 3: Event Log */}
                  <div className="bg-white rounded-xl border border-gray-200 flex flex-col overflow-hidden h-64 md:h-auto">
                    <div className="bg-gray-100 px-3 py-2 border-b border-gray-200 font-bold text-gray-700 text-xs uppercase tracking-wider">
                      📜 Rancho Journal
                    </div>
                    <div className="p-2 space-y-2 overflow-y-auto flex-1 bg-gray-50 inset-shadow">
                      {logs.map((log) => (
                        <div key={log.id} className={`p-2 rounded text-xs border-l-4 ${
                            log.type === 'good' ? 'bg-green-50 border-green-500 text-green-800' :
                            log.type === 'bad' ? 'bg-red-50 border-red-500 text-red-800' :
                            log.type === 'warn' ? 'bg-yellow-50 border-yellow-500 text-yellow-800' :
                            'bg-white border-gray-300 text-gray-700 shadow-sm'
                          }`}>
                          {log.text}
                        </div>
                      ))}
                    </div>
                  </div>

                </div>

                {/* --- HIDE TOSS MODAL --- */}
                {hideTossActive && (
                  <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                    <div className="bg-blue-50 rounded-2xl p-6 max-w-md w-full text-center border-4 border-cyan-400 shadow-2xl relative overflow-hidden">
                      <div className="absolute top-0 left-0 w-full h-2 bg-gray-200">
                        <div className="h-full bg-cyan-500 transition-all duration-1000" style={{ width: `${(hideTossTimer / 10) * 100}%` }}></div>
                      </div>
                      
                      <h2 className="text-2xl font-black text-blue-900 mt-2 mb-2">Cliff Hide Toss!</h2>
                      <p className="text-sm text-blue-800 mb-6">
                        Drag and drop the hides from the cliff to the waiting rowboats!
                      </p>

                      <div className="text-5xl mb-4 font-black text-cyan-600 border-4 border-cyan-200 rounded-full w-24 h-24 mx-auto flex items-center justify-center bg-white shadow-inner">
                        {hideTossTimer}s
                      </div>

                      <div className="flex justify-around items-center my-8 bg-blue-100 p-4 rounded-xl border border-blue-200 shadow-inner">
                        <div 
                          draggable 
                          onDragStart={(e) => {
                            e.dataTransfer.setData('text/plain', 'hide');
                            e.dataTransfer.effectAllowed = 'move';
                          }}
                          className="text-6xl cursor-grab active:cursor-grabbing hover:scale-110 transition-transform bg-white w-24 h-24 rounded-lg shadow-md flex items-center justify-center border-2 border-amber-700"
                        >
                          🟫
                        </div>

                        <div className="text-3xl animate-bounce text-blue-400">➡️</div>

                        <div 
                          onDragOver={(e) => {
                            e.preventDefault(); 
                            e.dataTransfer.dropEffect = 'move';
                          }}
                          onDrop={(e) => {
                            e.preventDefault();
                            if (e.dataTransfer.getData('text/plain') === 'hide') {
                              setHideTossScore(s => s + 1);
                            }
                          }}
                          className="text-6xl bg-blue-300 w-28 h-28 rounded-full flex flex-col items-center justify-center border-4 border-dashed border-blue-500 shadow-inner"
                        >
                          🚣
                          <span className="text-[10px] font-bold text-blue-900 mt-1 uppercase">Drop Here</span>
                        </div>
                      </div>

                      <div className="text-lg font-bold text-gray-700 mb-2">Hides Loaded: <span className="text-3xl text-amber-600">{hideTossScore}</span></div>
                    </div>
                  </div>
                )}

                {/* --- RODEO MODAL --- */}
                {rodeoActive && (
                  <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 cursor-crosshair">
                    <div className="bg-orange-50 rounded-2xl p-6 max-w-2xl w-full text-center border-4 border-amber-600 shadow-2xl relative overflow-hidden h-[60vh] flex flex-col">
                      <div className="absolute top-0 left-0 w-full h-2 bg-gray-200">
                        <div className="h-full bg-orange-500 transition-all duration-1000" style={{ width: `${(rodeoTimer / 10) * 100}%` }}></div>
                      </div>
                      
                      <div className="flex justify-between items-center mb-2 z-10 relative bg-white/50 p-2 rounded-xl backdrop-blur-sm">
                        <h2 className="text-2xl font-black text-orange-900">Rodeo!</h2>
                        <div className="text-2xl font-black text-orange-600 bg-white px-4 py-1 rounded-full border-2 border-orange-200">
                          {rodeoTimer}s
                        </div>
                        <div className="text-lg font-bold text-gray-700">Caught: <span className="text-2xl text-amber-600">{rodeoScore}</span></div>
                      </div>
                      
                      <p className="text-sm text-orange-800 mb-4 z-10 relative">
                        Click the animals as fast as you can to catch them!
                      </p>

                      <div className="flex-1 relative bg-amber-100/50 rounded-xl border-2 border-amber-200 shadow-inner overflow-hidden">
                         {rodeoTargets.map(t => (
                            <div 
                              key={t.id}
                              onMouseDown={(e) => {
                                 e.preventDefault();
                                 catchAnimal(t.id);
                              }}
                              className={`absolute ${t.size || 'text-5xl'} cursor-crosshair animate-dart hover:scale-110 active:scale-75 transition-transform`}
                              style={{ top: t.top, left: t.left, animationDelay: t.animationDelay }}
                            >
                              {t.icon}
                            </div>
                         ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* --- EVENT POPUP --- */}
                {eventPopup && (
                  <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-50 animate-pop-in pointer-events-none">
                    <div className={`${eventPopup.bgColor} text-white px-6 py-4 rounded-2xl shadow-2xl font-black text-xl md:text-2xl flex items-center gap-4 border-4 border-white`}>
                      <span className="text-4xl">{eventPopup.icon}</span>
                      {eventPopup.text}
                    </div>
                  </div>
                )}

                {/* --- SPLASH SCREEN MODAL --- */}
                {!gameStarted && (
                  <div className="fixed inset-0 bg-amber-900/95 flex items-center justify-center z-[60] p-4 backdrop-blur-sm">
                    <div className="bg-amber-50 rounded-3xl p-6 md:p-8 max-w-2xl w-full text-center border-8 border-amber-700 shadow-2xl relative">
                      <h1 className="text-4xl md:text-5xl font-black text-amber-900 mb-4 drop-shadow-sm">Rancho Tycoon</h1>
                      <h2 className="text-xl md:text-2xl font-bold text-amber-700 mb-6">Welcome to Alta California (1830s)</h2>
                      
                      <div className="text-left bg-white p-6 rounded-xl border-2 border-amber-200 mb-8 space-y-4 shadow-inner text-amber-900 font-medium">
                        <p>🐄 <strong>Grow Your Herd:</strong> Your cattle will multiply naturally over time. Don't process them all, or your herd won't grow!</p>
                        <p>🟫 <strong>The Hide Trade:</strong> Process cattle to get Hides ("California Banknotes") and Tallow (fat).</p>
                        <p>⚓ <strong>Trade Ships:</strong> Wait for ships from Boston to arrive. Trade your hides and tallow for luxury goods to earn <strong>Prestige</strong>.</p>
                        <p>🪶 <strong>Manage Your Rancho:</strong> Hire Native Workers (Vaqueros) to manage larger herds.</p>
                        <p>🎸 <strong>Special Events:</strong> Keep an eye out for randomly occurring Rodeos and Fandangos to boost your herd and prestige!</p>
                        <p>⚠️ <strong>Watch Out:</strong> Beware of grizzly bear attacks and severe droughts!</p>
                      </div>

                      <button 
                        onClick={() => setGameStarted(true)}
                        className="w-full md:w-auto px-12 py-4 bg-amber-600 hover:bg-amber-500 active:bg-amber-700 text-white rounded-xl font-black text-2xl shadow-[0_6px_0_rgb(180,83,9)] active:shadow-[0_0px_0_rgb(180,83,9)] active:translate-y-2 transition-all"
                      >
                        START PLAYING
                      </button>
                    </div>
                  </div>
                )}

              </div>
            </div>
          );
        }

        // Render the App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
